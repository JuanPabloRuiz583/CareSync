spring.application.name=agendamento-service
server.port=8082
spring.grpc.server.port=9091

spring.datasource.url=${AGENDAMENTO_DB_URL:jdbc:postgresql://localhost:5433/agendamentodb}
spring.datasource.username=${AGENDAMENTO_DB_USER:caresync}
spring.datasource.password=${AGENDAMENTO_DB_PASSWORD:caresync}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.locations=classpath:db/migration,classpath:db/devdata

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
