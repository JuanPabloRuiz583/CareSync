spring.application.name=patient-service
spring.grpc.server.port=9090

spring.datasource.url=${PATIENT_DB_URL:jdbc:postgresql://localhost:5432/patientdb}
spring.datasource.username=${PATIENT_DB_USER:caresync}
spring.datasource.password=${PATIENT_DB_PASSWORD:caresync}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.locations=classpath:db/migration,classpath:db/devdata
